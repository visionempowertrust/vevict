<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VICT Games</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="header-brand">
        <a class="logo-link" href="index.html" aria-label="Vision Empower home">
          <img src="assets/ve-logo.png" alt="Vision Empower">
        </a>
        <div>
          <p class="eyebrow">Vision Empower Computational Thinking</p>
          <h1>Games</h1>
        </div>
      </div>
      <div class="header-actions">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="registrations.html">Registrations</a>
        <a class="nav-link" href="outcomes.html">Outcomes</a>
        <a class="nav-link" href="session-entry.html">Session entry</a>
        <a class="nav-link" href="dashboard.html">Dashboard</a>
        <a class="nav-link" href="faqs.html">FAQs</a>
        <button id="sync-games" type="button">Sync DB</button>
        <img class="vict-logo" src="assets/vict-logo.svg" alt="VE Computational Thinking Games">
      </div>
    </header>

    <main class="skills-layout">
      <section class="panel">
        <div class="section-heading">
          <h2>Game master</h2>
        </div>
        <div class="table-wrap">
          <table class="data-table game-table">
            <thead>
              <tr>
                <th>Game Code</th>
                <th>Category</th>
                <th>Game</th>
                <th>Level</th>
                <th>Primary CT Skill</th>
                <th>How to Observe</th>
                <th>How to Play</th>
              </tr>
            </thead>
            <tbody id="games-table"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="how-to-play-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="how-to-play-title">
      <section class="modal-panel">
        <div class="section-heading">
          <h2 id="how-to-play-title">How to Play</h2>
          <button id="close-how-to-play" type="button">Close</button>
        </div>
        <div class="how-to-play-grid">
          <section>
            <h3>General Information</h3>
            <p id="how-to-play-general"></p>
          </section>
          <section>
            <h3>Overview and Rules</h3>
            <p id="how-to-play-rules"></p>
          </section>
          <section>
            <h3>Play Session Plans</h3>
            <p id="how-to-play-plans"></p>
          </section>
          <section>
            <h3>Source URL / Query</h3>
            <p id="how-to-play-source"></p>
          </section>
          <section>
            <h3>Level</h3>
            <p id="how-to-play-difficulty"></p>
          </section>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-store.js"></script>
    <script src="games.js"></script>
  </body>
</html>
