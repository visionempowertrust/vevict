<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VICT Outcomes</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="app-header">
      <div class="header-brand">
        <a class="logo-link" href="index.html" aria-label="Vision Empower home">
          <img src="assets/ve-logo.png" alt="Vision Empower">
        </a>
        <div>
          <p class="eyebrow">Vision Empower Computational Thinking</p>
          <h1>Outcomes</h1>
        </div>
      </div>
      <div class="header-actions">
        <a class="nav-link" href="index.html">Home</a>
      </div>
    </header>

    <main id="main-content" class="skills-layout">
      <section class="panel">
        <div class="section-heading">
          <h2>CT Outcomes</h2>
          <div class="section-actions">
            <span id="outcomes-status" class="muted">Loading...</span>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table outcomes-table">
            <thead>
              <tr>
                <th>Primary CT Skill Code</th>
                <th>Primary CT Skill</th>
                <th>1 - Emerging</th>
                <th>2 - Developing</th>
                <th>3 - Independent</th>
                <th>4 - Extending</th>
              </tr>
            </thead>
            <tbody id="outcomes-table"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <h2>CT SubOutcomes</h2>
          <span id="suboutcomes-count" class="muted">0 suboutcomes</span>
        </div>
        <div class="table-wrap">
          <table class="data-table suboutcomes-table">
            <thead>
              <tr>
                <th>Outcome Code</th>
                <th>Outcome</th>
                <th>Suboutcome Code</th>
                <th>SubOutcome</th>
                <th>Suboutcome Description</th>
              </tr>
            </thead>
            <tbody id="suboutcomes-table"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-store.js"></script>
    <script src="outcomes.js"></script>
    <script src="language.js"></script>
  </body>
</html>
