<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VICT Skills</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="header-brand">
        <a class="logo-link" href="index.html" aria-label="Vision Empower home">
          <img src="assets/ve-logo.svg" alt="Vision Empower">
        </a>
        <div>
          <p class="eyebrow">Vision Empower Computational Thinking</p>
          <h1>Skills</h1>
        </div>
      </div>
      <div class="header-actions">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="games.html">Games</a>
        <a class="nav-link" href="session-entry.html">Session entry</a>
        <a class="nav-link" href="dashboard.html">Dashboard</a>
        <button id="sync-skills" type="button">Sync DB</button>
        <img class="vict-logo" src="assets/vict-logo.svg" alt="VE Computational Thinking Games">
      </div>
    </header>

    <main class="skills-layout">
      <section class="panel">
        <div class="section-heading">
          <h2>Skill master</h2>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Skill Category</th>
                <th>Skill Name</th>
                <th>Skill Code</th>
                <th>Sub Skills</th>
              </tr>
            </thead>
            <tbody id="skills-table"></tbody>
          </table>
        </div>
      </section>

    </main>

    <div id="levels-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="levels-title">
      <section class="modal-panel">
        <div class="section-heading">
          <div>
            <h2 id="levels-title">Skill levels</h2>
            <p id="levels-subtitle" class="muted"></p>
          </div>
          <button id="close-levels" type="button">Close</button>
        </div>
        <div class="table-wrap">
          <table class="data-table level-table">
            <thead>
              <tr>
                <th>Source</th>
                <th>Skill Name</th>
                <th>Skill Code</th>
                <th>Level</th>
                <th>KLI Code</th>
                <th>Key Learning Indicators</th>
              </tr>
            </thead>
            <tbody id="levels-table"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-store.js"></script>
    <script src="skills.js"></script>
  </body>
</html>
